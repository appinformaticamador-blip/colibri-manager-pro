name: Apply COLIBRI ERP 5.2.0 Resultado real

on:
  push:
    branches: [feature-resultado-real-graficas-5-2-0]
    paths:
      - 'scripts/apply_result_real_5_2.py'
      - '.github/workflows/apply-result-real-5-2.yml'

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-resultado-real-graficas-5-2-0
          fetch-depth: 0
      - name: Apply Resultado real 5.2.0
        run: python3 scripts/apply_result_real_5_2.py
      - name: Verify source rules
        run: |
          grep -q "function ResultRealAnalytics" src/App.jsx
          grep -q "\['rango','Rango'\]" src/App.jsx
          grep -q "Personal · cuadrante" src/App.jsx
          grep -q '"version": "5.2.0"' package.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit verified source
        run: |
          git config user.name "appinformaticamador-blip"
          git config user.email "appinformaticamador@gmail.com"
          git add src/App.jsx src/styles.css package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "COLIBRÍ ERP 5.2.0 · Resultado real gráficas y análisis"
          git push origin feature-resultado-real-graficas-5-2-0
