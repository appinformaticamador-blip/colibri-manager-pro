name: Materialize COLIBRI ERP 5.1.4

on:
  push:
    branches:
      - fix-materialize-5-1-4
    paths:
      - '.github/workflows/materialize-colibri-5-1-4.yml'

permissions:
  contents: write

jobs:
  materialize-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-materialize-5-1-4
          fetch-depth: 0

      - name: Replace reconciliation with exact 5.1.4 source
        env:
          PAYMENT_FUNC_B64: ""
        run: |
          node <<'NODE'
          const fs=require('fs');
          let app=fs.readFileSync('src/App.jsx','utf8');
          const start=app.indexOf('function PaymentReconciliation({initialDate}){');
          const end=app.indexOf('function TPV({initialTab=',start);
          if(start<0||end<0) throw new Error('PaymentReconciliation markers not found');
          const replacement=Buffer.from(process.env.PAYMENT_FUNC_B64,'base64').toString('utf8');
          app=app.slice(0,start)+replacement+app.slice(end);
          fs.writeFileSync('src/App.jsx',app,'utf8');
          let css=fs.readFileSync('src/styles.css','utf8');
          if(!css.includes('.paymentTimeWindow{')) css+='\n.paymentTimeWindow{display:grid;gap:16px;background:#fff}.paymentTimeWindow h2{margin:.25rem 0;color:#28246f}.paymentTimeWindow p{margin:.25rem 0;color:#5d6b7e}.paymentTimeFields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end}.paymentTimeFields label{display:grid;gap:7px;color:#405167;font-weight:850}.paymentTimeFields input[type=date],.paymentTimeFields input[type=time]{width:100%;box-sizing:border-box}.paymentEndToggle{display:flex!important;align-items:center;gap:9px;min-height:48px;padding:0 4px}.paymentEndToggle input{width:20px!important;height:20px;flex:0 0 auto}.paymentTimeFields button{min-height:48px}.paymentTimeFields button:disabled{opacity:.5;cursor:not-allowed}.paymentAccountFilter b{color:#075f52}\n@media(max-width:900px){.paymentTimeFields{grid-template-columns:1fr 1fr}.paymentEndToggle{grid-column:1/-1}.paymentTimeFields button{grid-column:1/-1}}\n@media(max-width:560px){.paymentTimeFields{grid-template-columns:1fr}.paymentEndToggle,.paymentTimeFields button{grid-column:auto}}\n';
          fs.writeFileSync('src/styles.css',css,'utf8');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='5.1.4';p.scripts.dev='vite --host 0.0.0.0';p.scripts.build='vite build';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));l.version='5.1.4';if(l.packages&&l.packages[''])l.packages[''].version='5.1.4';fs.writeFileSync('package-lock.json',JSON.stringify(l,null,2)+'\n');
          NODE
          rm -f scripts/apply-colibri-5-1-4.mjs
          rm -f .github/patches/colibri-5.1.4.part*.b64

      - name: Verify selector is in real source
        run: |
          grep -q "paymentTimeWindow" src/App.jsx
          grep -q "Desde · hora" src/App.jsx
          grep -q "paymentTimeFields" src/styles.css

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit materialized source
        run: |
          rm -f .github/workflows/materialize-colibri-5-1-4.yml
          git config user.name "appinformaticamador-blip"
          git config user.email "appinformaticamador@gmail.com"
          git add -A
          git commit -m "COLIBRÍ ERP 5.1.4 · materializar conciliación por fecha y hora"
          git push origin HEAD:fix-materialize-5-1-4
